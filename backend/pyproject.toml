[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ticket-agent-backend"
version = "0.1.0"
description = "AI Ticket Agent backend (FastAPI + SQLite + HCL AICafe)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.25",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]
